# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        # 🚨 IMPORTANT: This will be replaced by Jenkins with the correct image tag
        image: your-docker-hub-username/your-image-name:latest 
        ports:
        - containerPort: 8080
      # If image is private, use this section
      # imagePullSecrets:
      # - name: docker-reg-secret
